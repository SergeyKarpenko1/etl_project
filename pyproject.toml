[project]
name = "etl"
version = "0.1.0"
description = "Simple ETL pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.11.0",
    "cookiecutter>=2.6.0",
    "pandas>=2.3.3",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
